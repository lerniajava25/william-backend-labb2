<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container py-4 py-md-5">
        <div class="mb-3">
            <a th:href="@{/tickets}" class="">< Back to tickets</a>
        </div>

        <article class="card ticket-card shadow-sm" th:classappend="'status-' + ${ticket.status}">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                    <h2 class="h5 mb-0">
                        <span class="text-muted fw-normal me-1" th:text="'#' + ${ticket.id}">#1</span>
                        <span th:text="${ticket.title}">Ticket title</span>
                    </h2>
                    <span class="badge rounded-pill status-badge flex-shrink-0"
                          th:text="${#strings.replace(ticket.status, '_', ' ')}">NEW</span>
                </div>

                <p class="text-secondary mb-3" th:text="${ticket.description}">
                    Ticket description
                </p>

                <div class="d-flex flex-wrap gap-3 gap-md-4 small text-muted">
                    <div>
                        <span class="text-uppercase fw-semibold me-1">Author</span>
                        <span class="text-body" th:text="${ticket.author?.username} ?: 'Unknown'">user</span>
                    </div>
                    <div>
                        <span class="text-uppercase fw-semibold me-1">Assignee</span>
                        <span class="text-body" th:if="${ticket.assignee != null}"
                              th:text="${ticket.assignee.username}">agent
                        </span>
                        <span class="fst-italic" th:if="${ticket.assignee == null}">Unassigned</span>
                    </div>
                    <div th:if="${ticket.createdAt != null}">
                        <span class="text-uppercase fw-semibold me-1">Created</span>
                        <time class="text-body"
                              th:datetime="${ticket.createdAt}"
                              th:text="${#temporals.format(ticket.createdAt, 'd MMM yyyy, HH:mm')}">1 Jan 2026, 12:00
                        </time>
                    </div>
                    <div th:if="${ticket.modifiedAt != null and ticket.modifiedAt != ticket.createdAt}">
                        <span class="text-uppercase fw-semibold me-1">Updated</span>
                        <time class="text-body"
                              th:datetime="${ticket.modifiedAt}"
                              th:text="${#temporals.format(ticket.modifiedAt, 'd MMM yyyy, HH:mm')}">1 Jan 2026, 12:00
                        </time>
                    </div>
                </div>
            </div>
        </article>

        <h2 class="mt-3">Comments</h2>
        <form th:action="@{/tickets/{id}/comments(id=${ticket.id})}" method="post" class="mb-2">
            <label for="commentTextInput">Comment</label>
            <textarea name="commentText" id="commentTextInput" class="form-control" rows="3" required></textarea>
            <button type="submit" class="btn btn-primary mt-2">Submit comment</button>
        </form>

        <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(comments)}">
            <article class="card ticket-card shadow-sm" th:each="comment : ${comments}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                        <h2 class="h5 mb-0">
                            <span th:text="${comment.author.username}">Comment author</span>
                            <th:block th:replace="~{fragments/role-badge :: badge(${comment.author})}"></th:block>
                        </h2>
                    </div>

                    <p class="ticket-description text-secondary mb-3" th:text="${comment.commentText}">
                        Comment text
                    </p>
                </div>
            </article>
        </div>

        <div class="card border-0 shadow-sm text-center py-5" th:if="${#lists.isEmpty(comments)}">
            <div class="card-body">
                <h2 class="h5">No comments yet</h2>
                <p class="text-muted mb-0">Comments will show up here.</p>
            </div>
        </div>
    </main>
</body>
</html>
