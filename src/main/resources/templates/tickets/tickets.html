<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container py-4 py-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
            <div>
                <h1 class="h3 mb-1">Tickets</h1>
                <p class="text-muted mb-0">
                    <span th:text="${#lists.size(tickets)}">0</span>
                    <span th:text="${#lists.size(tickets) == 1} ? 'ticket' : 'tickets'">tickets</span>
                </p>
            </div>
        </div>

        <div class="row row-cols-2 row-cols-md-5 g-3 mb-4">
            <div class="col" th:each="statusOption : ${T(org.example.backendlabb2.entities.TicketStatus).values()}">
                <div class="card stat-card shadow-sm border-0 h-100" th:classappend="'status-' + ${statusOption}">
                    <div class="card-body py-3">
                        <div class="small text-muted text-uppercase mb-2">
                            <span class="stat-dot me-1"></span>
                            <span th:text="${#strings.replace(statusOption, '_', ' ')}">Status</span>
                        </div>
                        <div class="stat-value"
                             th:text="${#lists.size(tickets.?[status.name() == '__${statusOption}__'])}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(tickets)}">
            <article class="card ticket-card shadow-sm" th:each="ticket : ${tickets}"
                     th:classappend="'status-' + ${ticket.status}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                        <h2 class="h5 mb-0">
                            <span class="text-muted fw-normal me-1" th:text="'#' + ${ticket.id}">#1</span>
                            <a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.title}">Ticket title</a>
                        </h2>
                        <span class="badge rounded-pill status-badge flex-shrink-0"
                              th:text="${#strings.replace(ticket.status, '_', ' ')}">NEW</span>
                    </div>

                    <p class="ticket-description text-secondary mb-3" th:text="${ticket.description}">
                        Ticket description
                    </p>
                </div>
            </article>
        </div>

        <div class="card border-0 shadow-sm text-center py-5" th:if="${#lists.isEmpty(tickets)}">
            <div class="card-body">
                <h2 class="h5">No tickets yet</h2>
                <p class="text-muted mb-0">Tickets you create will show up here.</p>
            </div>
        </div>
    </main>
</body>
</html>
