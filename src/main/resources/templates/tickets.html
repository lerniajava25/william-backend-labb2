<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .status-NEW              { --status-color: #0d6efd; }
        .status-IN_PROGRESS      { --status-color: #fd7e14; }
        .status-WAITING_FOR_USER { --status-color: #6f42c1; }
        .status-RESOLVED         { --status-color: #198754; }
        .status-CLOSED           { --status-color: #6c757d; }

        .status-badge {
            background-color: var(--status-color);
            color: #fff;
            font-weight: 500;
            letter-spacing: .02em;
        }

        .ticket-card {
            border: 0;
            border-left: 4px solid var(--status-color);
            transition: box-shadow .15s ease-in-out, transform .15s ease-in-out;
        }

        .ticket-card:hover {
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .08) !important;
            transform: translateY(-1px);
        }

        .ticket-description {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .stat-card .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1;
        }

        .stat-card .stat-dot {
            display: inline-block;
            width: .6rem;
            height: .6rem;
            border-radius: 50%;
            background-color: var(--status-color);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-semibold">Support desk</span>
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="text-white-50 small d-none d-sm-inline">
                    Signed in as
                    <span class="text-white fw-semibold" sec:authentication="name">user</span>
                    <span class="badge text-bg-danger ms-1" sec:authorize="hasRole('ADMIN')">Admin</span>
                    <span class="badge text-bg-info ms-1" sec:authorize="hasRole('AGENT')">Agent</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
            <div>
                <h1 class="h3 mb-1">Tickets</h1>
                <p class="text-muted mb-0">
                    <span th:text="${#lists.size(tickets)}">0</span>
                    <span th:text="${#lists.size(tickets) == 1} ? 'ticket' : 'tickets'">tickets</span>
                </p>
            </div>
        </div>

        <div class="row row-cols-2 row-cols-md-5 g-3 mb-4">
            <div class="col" th:each="statusOption : ${T(org.example.backendlabb2.entities.TicketStatus).values()}">
                <div class="card stat-card shadow-sm border-0 h-100" th:classappend="'status-' + ${statusOption}">
                    <div class="card-body py-3">
                        <div class="small text-muted text-uppercase mb-2">
                            <span class="stat-dot me-1"></span>
                            <span th:text="${#strings.replace(statusOption, '_', ' ')}">Status</span>
                        </div>
                        <div class="stat-value"
                             th:text="${#lists.size(tickets.?[status.name() == '__${statusOption}__'])}">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(tickets)}">
            <article class="card ticket-card shadow-sm" th:each="ticket : ${tickets}"
                     th:classappend="'status-' + ${ticket.status}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                        <h2 class="h5 mb-0">
                            <span class="text-muted fw-normal me-1" th:text="'#' + ${ticket.id}">#1</span>
                            <span th:text="${ticket.title}">Ticket title</span>
                        </h2>
                        <span class="badge rounded-pill status-badge flex-shrink-0"
                              th:text="${#strings.replace(ticket.status, '_', ' ')}">NEW</span>
                    </div>

                    <p class="ticket-description text-secondary mb-3" th:text="${ticket.description}">
                        Ticket description
                    </p>

                    <div class="d-flex flex-wrap gap-3 gap-md-4 small text-muted">
                        <div>
                            <span class="text-uppercase fw-semibold me-1">Author</span>
                            <span class="text-body" th:text="${ticket.author?.username} ?: 'Unknown'">user</span>
                        </div>
                        <div>
                            <span class="text-uppercase fw-semibold me-1">Assignee</span>
                            <span class="text-body" th:if="${ticket.assignee != null}"
                                  th:text="${ticket.assignee.username}">agent</span>
                            <span class="fst-italic" th:if="${ticket.assignee == null}">Unassigned</span>
                        </div>
                        <div th:if="${ticket.createdAt != null}">
                            <span class="text-uppercase fw-semibold me-1">Created</span>
                            <time class="text-body"
                                  th:datetime="${ticket.createdAt}"
                                  th:text="${#temporals.format(ticket.createdAt, 'd MMM yyyy, HH:mm')}">1 Jan 2026, 12:00</time>
                        </div>
                        <div th:if="${ticket.modifiedAt != null and ticket.modifiedAt != ticket.createdAt}">
                            <span class="text-uppercase fw-semibold me-1">Updated</span>
                            <time class="text-body"
                                  th:datetime="${ticket.modifiedAt}"
                                  th:text="${#temporals.format(ticket.modifiedAt, 'd MMM yyyy, HH:mm')}">1 Jan 2026, 12:00</time>
                        </div>
                    </div>
                </div>
            </article>
        </div>

        <div class="card border-0 shadow-sm text-center py-5" th:if="${#lists.isEmpty(tickets)}">
            <div class="card-body">
                <h2 class="h5">No tickets yet</h2>
                <p class="text-muted mb-0">Tickets you create will show up here.</p>
            </div>
        </div>
    </main>
</body>
</html>
