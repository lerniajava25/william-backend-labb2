<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tickets</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  crossorigin="anonymous" integrity>
</head>
<body class="container mt-5">
    <h1 class="mb-4">Tickets</h1>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Author</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.getTitle()}">Title</td>
                <td th:text="${ticket.getDescription()}">Description</td>
                <td th:text="${ticket.getStatus()}">Status</td>
                <td th:text="${ticket.author?.username}">Author</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
