<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit user</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container py-4 py-md-5">
        <div class="mb-3">
            <a th:href="@{/users}" class="">< Back to users</a>
        </div>

        <article class="card ticket-card shadow-sm" th:classappend="'user-' + ${user.role}">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                    <h2 class="h5 mb-0">
                        <span class="text-muted fw-normal me-1" th:text="'#' + ${user.id}">#1</span>
                        <span th:text="${user.username}">Username</span>
                    </h2>
                    <div class="d-flex gap-2">
                        <form th:action="@{/users/{id}/update-role(id=${user.id})}" method="post"
                              class="flex-shrink-0" sec:authorize="hasRole('ADMIN')">
                            <label for="roleSelect" class="visually-hidden">Role</label>
                            <select id="roleSelect" name="role"
                                    class="form-select form-select-sm rounded-pill user-badge attribute-select"
                                    onchange="this.form.submit()">
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:selected="${r == user.role}"
                                        th:text="${#strings.replace(r, '_', ' ')}">USER</option>
                            </select>
                        </form>
                        <form th:action="@{/users/{id}/update-status(id=${user.id})}" method="post"
                              class="flex-shrink-0" sec:authorize="hasRole('ADMIN')">
                            <label for="userStatusSelect" class="visually-hidden">Status</label>
                            <select id="userStatusSelect" name="active"
                                    class="form-select form-select-sm rounded-pill attribute-select text-light"
                                    th:classappend="${user.active ? 'bg-success' : 'bg-danger'}"
                                    onchange="this.form.submit()">
                                <option th:value="${true}"
                                        th:selected="${user.active}"
                                        th:text="${'Active'}">Active</option>
                                <option th:value="${false}"
                                        th:selected="${!user.active}"
                                        th:text="${'Inactive'}">Inactive</option>
                            </select>
                        </form>
                    </div>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
