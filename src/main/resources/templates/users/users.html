<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="container py-4 py-md-5">
        <div class="mb-3">
            <a th:href="@{/tickets}" class="">< Back to tickets</a>
        </div>

        <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(users)}">
            <article class="card ticket-card shadow-sm" th:each="user : ${users}" th:classappend="'user-' + ${user.role}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                        <h2 class="h5 mb-0">
                            <span class="text-muted fw-normal me-1" th:text="'#' + ${user.id}">#1</span>
                            <a th:href="@{/users/{id}(id=${user.id})}" th:text="${user.username}">Username</a>
                        </h2>
                        <div class="d-flex gap-2">
                            <span class="badge rounded-pill user-badge flex-shrink-0"
                                  th:text="${#strings.replace(user.role, '_', ' ')}">Role</span>
                            <span class="badge rounded-pill bg-success" th:if="${user.isActive()}">Active</span>
                            <span class="badge rounded-pill bg-danger" th:if="${!user.isActive()}">Inactive</span>
                        </div>
                    </div>
                </div>
            </article>
        </div>

        <div class="card border-0 shadow-sm text-center py-5" th:if="${#lists.isEmpty(users)}">
            <div class="card-body">
                <h2 class="h5">No users yet</h2>
                <p class="text-muted mb-0">System users show up here.</p>
            </div>
        </div>
    </main>
</body>
</html>
